name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Frontend: lint, format, typecheck, test, build ──────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # ── Backend: Python syntax check ────────────────────────
  backend:
    name: Backend (Python syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax (backend)
        run: |
          python -m compileall backend/app -q
